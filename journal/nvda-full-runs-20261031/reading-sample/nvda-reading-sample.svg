<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1230" viewBox="0 0 1100 1230" role="img" aria-labelledby="title desc"><title id="title">英伟达研究简报阅读样例</title><desc id="desc">股价日线、三个重点数字、两个业务观察信号和下一步验证条件。数据来自已有研究材料。</desc><rect width="1100" height="1230" fill="#fcfcfb"/><style>text{font-family:"PingFang SC","Heiti SC",sans-serif;fill:#0b0b0b}.muted{fill:#52514e}.small{font-size:15px}.body{font-size:21px}.title{font-size:37px;font-weight:600}.label{font-size:18px}.num{font-size:44px;font-weight:600}</style><text x="55" y="44" class="small muted">投研助手 / 阅读样例 · 2026-10-31 · 基于已采集材料</text><text x="55" y="104" class="title">收入预期仍增长，市场为何回撤？</text><text x="55" y="148" class="body">优先检验：市场是否开始更重视 AI 投入回报与增长的现金转化。</text><text x="55" y="180" class="label muted">这是研究判断；现有材料对整月跌幅的解释仍不充分。</text><line x1="55" y1="207" x2="1045" y2="207" stroke="#deded9"/><text x="55" y="245" class="label muted">10 月累计价格变化</text><text x="55" y="298" class="num">−10.39%</text><text x="55" y="330" class="small muted">9/30 收盘 → 10/30 收盘</text><text x="400" y="245" class="label muted">月内最高收盘至月末</text><text x="400" y="298" class="num">−14.46%</text><text x="400" y="330" class="small muted">10/6 收盘 → 10/30 收盘</text><text x="745" y="245" class="label muted">Q3 收入指引中点环比</text><text x="745" y="298" class="num">约 +12.3%</text><text x="745" y="330" class="small muted">管理层预期，尚待财报兑现</text><text x="55" y="385" class="body">NVDA 日收盘价：10 月先涨后跌</text><text x="55" y="412" class="small muted">美元 / 价格收益，不含股息</text><line x1="105" y1="630.5" x2="1005" y2="630.5" stroke="#e9e9e4"/><text x="58" y="635.5" class="small muted">200</text><line x1="105" y1="552.5" x2="1005" y2="552.5" stroke="#e9e9e4"/><text x="58" y="557.5" class="small muted">220</text><line x1="105" y1="474.5" x2="1005" y2="474.5" stroke="#e9e9e4"/><text x="58" y="479.5" class="small muted">240</text><polyline fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="105.00,519.82 145.91,510.15 186.82,498.10 227.73,478.79 268.64,477.46 309.55,484.37 350.45,511.63 391.36,516.31 432.27,527.85 473.18,519.27 514.09,547.43 555.00,563.30 595.91,575.39 636.82,563.85 677.73,566.27 718.64,544.82 759.55,582.88 800.45,587.76 841.36,568.10 882.27,560.53 923.18,570.52 964.09,577.23 1005.00,612.40"/><circle cx="105.0" cy="519.818" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="113.0" y="506.818" class="small">228.38</text><circle cx="268.6363636363636" cy="477.46399999999994" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="276.6363636363636" y="464.46399999999994" class="small">239.24</text><circle cx="1005.0" cy="612.404" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="920.0" y="599.404" class="small">204.64</text><text x="85.0" y="680" class="small muted">9/30</text><text x="248.63636363636363" y="680" class="small muted">10/6</text><text x="985.0" y="680" class="small muted">10/30</text><line x1="55" y1="709" x2="1045" y2="709" stroke="#deded9"/><text x="55" y="750" class="body">两个最值得追踪的业务信号</text><text x="55" y="790" class="body">01  收入目标上升，毛利率目标下降</text><text x="95" y="822" class="label muted">Q3 收入指引 1,080 亿美元 ±2%；毛利率指引约 74%，Q2 为 75%。</text><text x="95" y="851" class="label muted">要看新增收入能带来多少利润，以及后续指引能否继续增强。</text><text x="55" y="894" class="body">02  高增长之外，还要检查现金回收</text><text x="95" y="926" class="label muted">Q2 经营现金流 240.77 亿美元；应收变动占用现金 223.46 亿美元。</text><text x="95" y="955" class="label muted">要看下一季现金转化是否改善；这些旧季数字没有确认 10 月订单变化。</text><line x1="55" y1="982" x2="1045" y2="982" stroke="#deded9"/><text x="55" y="1021" class="body">下一份财报怎样改变判断？</text><text x="55" y="1060" class="label">担忧减弱：收入兑现、现金回收改善、后续指引增强。</text><text x="55" y="1093" class="label">担忧增强：增长伴随应收继续攀升、现金转化持续走弱。</text><line x1="55" y1="1118" x2="1045" y2="1118" stroke="#deded9"/><text x="55" y="1150" class="small muted">来源：FT/LSEG 与 Yahoo 历史行情；NVIDIA FY2027 Q2 官方财报。</text><text x="55" y="1176" class="small muted">核心缺口：尚缺可靠估值及分析师预期，未完成整月下跌归因。</text><text x="55" y="1202" class="small muted">表达样例，不是新增研究；逐日数据、来源链接和口径见配套说明。</text></svg>