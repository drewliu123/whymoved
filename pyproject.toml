[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "whymoved"
dynamic = ["version"]
description = "Explain why a stock or crypto asset moved. Only news published before the move counts as a cause."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["stocks", "crypto", "news", "finance", "agent-skill", "claude-code", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/drewliu123/whymoved"
Issues = "https://github.com/drewliu123/whymoved/issues"

[project.scripts]
whymoved = "whymoved.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/whymoved/scripts" }
packages = ["whymoved"]

[tool.setuptools.dynamic]
version = { attr = "whymoved.__version__" }

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731", "B008", "UP006", "UP035"]
