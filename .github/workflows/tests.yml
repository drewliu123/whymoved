name: Offline Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    env:
      TOUYAN_HOME: ${{ runner.temp }}/touyan-data
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify frozen example file hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('examples/msft-cashflow').resolve()
          manifest = json.loads((root / 'SHA256.json').read_text())
          for relative, expected in manifest.items():
              path = (root / relative).resolve()
              assert root in path.parents, relative
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, relative
          print('Verified', len(manifest), 'example files')
          PY
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests
      - name: Recompute frozen example arithmetic
        run: |
          python examples/msft-cashflow/research/recompute_bridge.py
          python examples/msft-cashflow/research/work/arithmetic.py
      - name: Validate frozen example contracts
        run: |
          python scripts/research_plan.py examples/msft-cashflow/research/work/plan.json
          python scripts/sources.py validate examples/msft-cashflow/research/work/sources.json
          python scripts/check_claims.py examples/msft-cashflow/research/work/claims.json --sources examples/msft-cashflow/research/work/sources.json --json
          python scripts/analysis_contract.py check --plan examples/msft-cashflow/research/work/plan.json --report examples/msft-cashflow/research/work/report.json --claims examples/msft-cashflow/research/work/claims.json --sources examples/msft-cashflow/research/work/sources.json
      - name: Render frozen example without a model or API
        run: |
          python scripts/render_report.py examples/msft-cashflow/research/work/report.json --claims examples/msft-cashflow/research/work/claims.json --sources examples/msft-cashflow/research/work/sources.json --out-dir "$RUNNER_TEMP/touyan-example-render"
