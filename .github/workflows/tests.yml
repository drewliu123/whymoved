name: Offline Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure isolated research data
        run: echo "TOUYAN_HOME=$RUNNER_TEMP/touyan-data" >> "$GITHUB_ENV"
      - name: Verify frozen example file hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          count = 0
          for manifest_path in sorted(Path('examples').glob('*/SHA256.json')):
              root = manifest_path.parent.resolve()
              manifest = json.loads(manifest_path.read_text())
              for relative, expected in manifest.items():
                  path = (root / relative).resolve()
                  assert root in path.parents, relative
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, (root.name, relative)
                  count += 1
              print('Verified', len(manifest), 'files in', root.name)
          print('Verified', count, 'example files in total')
          PY
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests
      - name: Recompute frozen example arithmetic
        run: |
          python examples/msft-cashflow/research/recompute_bridge.py
          python examples/msft-cashflow/research/work/arithmetic.py
      - name: Validate every frozen example contract
        run: |
          for work in examples/*/research/work; do
            echo "== $work"
            python scripts/research_plan.py "$work/plan.json"
            python scripts/sources.py validate "$work/sources.json"
            python scripts/check_claims.py "$work/claims.json" --sources "$work/sources.json" --json
            python scripts/analysis_contract.py check --plan "$work/plan.json" --report "$work/report.json" --claims "$work/claims.json" --sources "$work/sources.json"
          done
      - name: Render every frozen example without a model or API
        run: |
          for work in examples/*/research/work; do
            name=$(basename "$(dirname "$(dirname "$work")")")
            echo "== $name"
            python scripts/render_report.py "$work/report.json" --claims "$work/claims.json" --sources "$work/sources.json" --out-dir "$RUNNER_TEMP/touyan-render-$name"
          done
